[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-transfer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "python-pptx>=1,<2",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pyarrow>=17,<24",
    "defusedxml>=0.7.1,<1",
    "py7zr>=0.22,<2",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
recovery = ["resvg-py>=0.5,<1", "ezdxf>=1.3,<2", "rarfile>=4,<5"]
vision = ["torch>=2", "transformers>=4.51,<6", "sentencepiece>=0.2", "protobuf>=4", "safetensors>=0.4"]
semantic = ["sentence-transformers>=3"]
large-images = ["pyvips[binary]"]
ocr-local = ["paddleocr>=3.3,<4", "paddlepaddle>=3.2,<4"]
ocr-cloud = ["google-cloud-vision>=3.10,<4"]
demo = ["pandas>=2.2", "ifcopenshell>=0.8,<0.9"]

[project.scripts]
silver-transfer = "silver_transfer.cli:main"

[tool.setuptools.packages.find]
include = ["silver_transfer*"]
